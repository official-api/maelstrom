<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MAELSTROM — Digital Twin</title>
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="app">

  <!-- ===================== LEFT — MAIN 3D SIMULATION ===================== -->
  <section id="panel-main" class="panel">
    <canvas id="main-canvas"></canvas>

    <div class="hud-top">
      <div class="hud-brand">
        <span class="hud-brand-mark"></span>
        <span id="brand-title">MAELSTROM</span>
      </div>
      <button id="btn-replay" class="btn btn-ghost" title="Restart the sequence">↺ Replay</button>
    </div>

    <div id="alert-banner" class="alert-banner hidden">
      <span class="alert-dot"></span>
      <span id="alert-text">SWARM DETECTED</span>
    </div>

    <div id="main-caption" class="main-caption hidden"></div>
  </section>

  <!-- ===================== RIGHT COLUMN ===================== -->
  <div id="panel-right-col">

    <!-- TOP RIGHT — control / animation panel -->
    <section id="panel-top" class="panel">
      <div class="panel-label" id="top-panel-label">Control</div>
      <div id="top-panel-body" class="panel-body">

        <!-- INTRO / IDLE STAGE -->
        <div id="stage-intro" class="stage">
          <h2 id="intro-title"></h2>
          <p id="intro-body" class="desc"></p>
          <button id="btn-begin" class="btn btn-primary">Begin Attack</button>
        </div>

        <!-- MODE SELECT STAGE -->
        <div id="stage-select" class="stage hidden">
          <h2 id="select-title"></h2>
          <p id="select-body" class="desc"></p>
          <div class="btn-row">
            <button id="btn-hard" class="btn btn-danger">Hard Kill</button>
            <button id="btn-soft" class="btn btn-secondary">Soft Kill</button>
          </div>
        </div>

        <!-- ENGINE CUTAWAY STAGE -->
        <div id="stage-engine" class="stage hidden">
          <canvas id="engine-canvas" class="anim-canvas"></canvas>
          <h2 id="engine-title"></h2>
          <p id="engine-body" class="desc"></p>
          <button id="btn-next-stage" class="btn btn-primary hidden">Next Stage</button>
        </div>

        <!-- OPTICAL TRACKING STAGE -->
        <div id="stage-tracking" class="stage hidden">
          <div class="optical-wrap">
            <canvas id="optical-render-canvas" class="anim-canvas optical-render"></canvas>
            <canvas id="optical-overlay-canvas" class="anim-canvas optical-overlay"></canvas>
            <div class="optical-frame"></div>
          </div>
          <h2 id="tracking-title"></h2>
          <p id="tracking-body" class="desc"></p>
        </div>

        <!-- RESULT / COST COMPARISON STAGE -->
        <div id="stage-result" class="stage hidden">
          <h2 id="result-title"></h2>
          <div class="cost-compare">
            <div class="cost-card cost-card-bad">
              <div class="cost-label" id="cost-left-label"></div>
              <div class="cost-figure" id="cost-left-figure"></div>
              <div class="cost-note" id="cost-left-note"></div>
            </div>
            <div class="cost-vs">vs</div>
            <div class="cost-card cost-card-good">
              <div class="cost-label" id="cost-right-label"></div>
              <div class="cost-figure" id="cost-right-figure"></div>
              <div class="cost-note" id="cost-right-note"></div>
            </div>
          </div>
          <p class="desc cost-footnote" id="cost-footnote"></p>

          <div class="feature-menu">
            <div class="feature-menu-title" id="feature-menu-title"></div>
            <div class="btn-row btn-row-wrap">
              <button class="btn btn-outline" data-feature="aerofoil"></button>
              <button class="btn btn-outline" data-feature="fragWarhead"></button>
              <button class="btn btn-outline" data-feature="carbonFibre"></button>
            </div>
          </div>
        </div>

        <!-- FEATURE DEEP-DIVE STAGE -->
        <div id="stage-feature" class="stage hidden">
          <button id="btn-feature-back" class="btn btn-ghost btn-back">← Back</button>
          <canvas id="feature-canvas" class="anim-canvas"></canvas>
          <h2 id="feature-title"></h2>
          <p id="feature-body" class="desc"></p>
        </div>

      </div>
    </section>

    <!-- BOTTOM RIGHT — trajectory panel -->
    <section id="panel-bottom" class="panel">
      <div class="panel-label" id="bottom-panel-label">Trajectory</div>
      <canvas id="trajectory-canvas" class="anim-canvas"></canvas>
    </section>

  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
